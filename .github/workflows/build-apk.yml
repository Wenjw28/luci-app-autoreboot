name: Build autoreboot apk for MT7987A
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare SDK
      run: |
        SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL" -O sdk.tar.zst
        tar --zstd -xf sdk.tar.zst
        SDK=$(ls -d openwrt-sdk-* | head -n1)
        echo "SDK=$SDK" >> $GITHUB_ENV
        echo "SDK 路径: $SDK"

    - name: Stage package
      run: |
        mkdir -p "$SDK/package/luci-app-autoreboot"
        cp -r Makefile files "$SDK/package/luci-app-autoreboot/"
        echo "--- 已复制内容 ---"
        ls -R "$SDK/package/luci-app-autoreboot"

    - name: Build
      run: |
        cd "$SDK"

        # 1) 修复 luci feed 死 commit
        sed -i 's|git.openwrt.org/project/luci.git\^[0-9a-f]*|git.openwrt.org/project/luci.git;openwrt-25.12|' feeds.conf.default

        # 2) 全量更新所有 feed（base/packages/luci），解决依赖缺失
        ./scripts/feeds update -a

        # 3) 安装所有 feed 包，确保 rpcd/libucode/libubox/lua 等底层依赖存在
        ./scripts/feeds install -a

        # 4) 最小配置：只锁 target + 单包，其余交给 defconfig
        rm -f .config .config.old
        cat > .config <<'EOF'
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_generic=y
        CONFIG_PACKAGE_luci-app-autoreboot=y
        CONFIG_USE_APK=y
        EOF

        # 5) 展开配置（无头环境安全，无 menuconfig）
        make defconfig

        # 6) 调试：确认包确实被选入
        echo "=== 验证包是否被选中 ==="
        grep -E 'luci-app-autoreboot|luci-base|libucode|rpcd|USE_APK' .config || true

        # 7) 编译单包（纯 Lua 约 20~40 秒）
        echo "=== 开始编译 ==="
        make package/luci-app-autoreboot/compile -j$(nproc) V=s

    - name: Collect apk
      run: |
        mkdir -p /tmp/out
        find "$SDK/bin/" -name 'luci-app-autoreboot*.apk' -exec cp {} /tmp/out/ \;
        echo "--- 产物 ---"
        ls -lh /tmp/out 2>/dev/null || echo "未找到 apk"

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-autoreboot-mt7987a-apk
        path: /tmp/out/*.apk
