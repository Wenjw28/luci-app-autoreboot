name: Build autoreboot apk for MT7987A
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare SDK
      run: |
        SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL" -O sdk.tar.zst
        tar --zstd -xf sdk.tar.zst
        SDK=$(ls -d openwrt-sdk-*)
        echo "SDK=$SDK" >> $GITHUB_ENV
        
    - name: Stage package
      run: |
        mkdir -p "$SDK/package/luci-app-autoreboot"
        cp -r Makefile files "$SDK/package/luci-app-autoreboot/"
        
    - name: Build
      run: |
        cd "$SDK"
        # 仅修复 luci 分支，不碰其他 feeds
        sed -i 's|git.openwrt.org/project/luci.git\^[0-9a-f]*|git.openwrt.org/project/luci.git;openwrt-25.12|' feeds.conf.default
        ./scripts/feeds update luci
        ./scripts/feeds install luci-base luci-mod-admin-full luci-theme-bootstrap
        cat >> .config <<EOF
        CONFIG_PACKAGE_luci-app-autoreboot=m
        CONFIG_USE_APK=y
        CONFIG_LUCI_LANG_zh_Hans=y
        EOF
        make defconfig
        make package/luci-app-autoreboot/compile -j$(nproc) V=s
        
    - name: Collect apk
      run: |
        mkdir -p /tmp/out
        find "$SDK/bin/" -name 'luci-app-autoreboot*.apk' -exec cp {} /tmp/out/ \;
        ls -lh /tmp/out
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-autoreboot-mt7987a-apk
        path: /tmp/out/*.apk
