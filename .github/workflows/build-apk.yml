name: Build LuCI App APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y tar gzip

      - name: Build APK
        run: |
          PKG_NAME="luci-app-autoreboot"
          PKG_VER="1.0-1"
          TMP_DIR="pkg_build"
          
          # 关键：进入 files 目录打包，避免路径多一层 files/
          mkdir -p $TMP_DIR/$PKG_NAME
          cp -r files/* $TMP_DIR/$PKG_NAME/ 2>/dev/null || cp -r files/. $TMP_DIR/$PKG_NAME/
          
          # 确保脚本可执行
          chmod +x $TMP_DIR/$PKG_NAME/etc/init.d/autoreboot 2>/dev/null
          
          # 打包为标准 apk (data.tar.gz + control)
          cd $TMP_DIR
          mkdir -p $PKG_NAME/CONTROL
          cat > $PKG_NAME/CONTROL/control <<EOF
          Package: $PKG_NAME
          Version: $PKG_VER
          Architecture: all
          Description: LuCI App for Auto Reboot
          Section: luci
          Priority: optional
          Maintainer: you
          EOF
          
          # 打数据包 (相对路径，根目录对应 /)
          tar -czf $PKG_NAME/data.tar.gz -C $PKG_NAME .
          # 打控制包
          tar -czf $PKG_NAME/control.tar.gz -C $PKG_NAME/CONTROL .
          
          # 组装 apk (简易方式，实际可用 apk-tools 但此方式兼容)
          # 更稳的是用 abuild，但为简化，直接生成可用结构
          # 最终输出
          mv $PKG_NAME/data.tar.gz ${PKG_NAME}_${PKG_VER}_all.apk
          # 注：标准 apk 是带控制信息的，上述仅数据。若需完整，建议用以下命令：
          # (echo -e "data.tar.gz\ncontrol.tar.gz" | tar -czf ${PKG_NAME}_${PKG_VER}_all.apk -T -)
          
          # 实际推荐：用 apk 工具构建（需安装 apk-tools）
          # 这里给出最简可行包：直接 tar 包含数据，OpenWrt 可识别（但非标准）
          # 为通过 apk add，必须标准。改用以下：
          cd ..
          ar rcs ${PKG_NAME}_${PKG_VER}_all.apk $TMP_DIR/$PKG_NAME/control.tar.gz $TMP_DIR/$PKG_NAME/data.tar.gz
          
          echo "APK_SIZE=$(stat -c%s ${PKG_NAME}_${PKG_VER}_all.apk)" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-autoreboot-apk
          path: "*.apk"
