name: Build autoreboot apk for MT7987A

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Build luci-app-autoreboot.apk (Manual Pack)
      run: |
        set -e
        PKGVER=1.0-1
        ROOT=$(mktemp -d)/pkg
        mkdir -p "$ROOT/etc/config" "$ROOT/etc/init.d" \
                 "$ROOT/usr/lib/lua/luci/controller" \
                 "$ROOT/usr/lib/lua/luci/model/cbi"

        # 1) 复制 files/ 里的运行时文件
        cp files/etc/config/autoreboot "$ROOT/etc/config/autoreboot" 2>/dev/null || true
        cp files/etc/init.d/autoreboot "$ROOT/etc/init.d/autoreboot" 2>/dev/null || true
        chmod 755 "$ROOT/etc/init.d/autoreboot"

        # 2) LuCI Lua 文件
        [ -f files/usr/lib/lua/luci/controller/autoreboot.lua ] && \
          cp files/usr/lib/lua/luci/controller/autoreboot.lua \
             "$ROOT/usr/lib/lua/luci/controller/autoreboot.lua"
        [ -f files/usr/lib/lua/luci/model/cbi/autoreboot.lua ] && \
          cp files/usr/lib/lua/luci/model/cbi/autoreboot.lua \
             "$ROOT/usr/lib/lua/luci/model/cbi/autoreboot.lua"

        # 3) 写 control（OpenWrt apk 控制段）
        META=$(mktemp -d)
        cat > "$META/control" <<EOF
        Package: luci-app-autoreboot
        Version: $PKGVER
        Architecture: all
        Maintainer: Wenjw28
        Depends: luci-base, cron
        Section: luci
        Description: LuCI app for scheduled reboot (MT7987A / OpenWrt 25.x)
        EOF

        # 4) 打包：magic(!APK\x00) + control.tar.gz + data.tar.gz
        tar -czf "$META/control.tar.gz" -C "$META" control
        tar -czf "$META/data.tar.gz" -C "$ROOT" .

        APK="luci-app-autoreboot_${PKGVER}_all.apk"
        printf '!APK\x00' > "/tmp/$APK"
        cat "$META/control.tar.gz" >> "/tmp/$APK"
        cat "$META/data.tar.gz"   >> "/tmp/$APK"

        mkdir -p /tmp/out
        cp "/tmp/$APK" /tmp/out/
        ls -lh /tmp/out

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-autoreboot-mt7987a-apk
        path: /tmp/out/*.apk
