name: Build autoreboot apk for MT7987A
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Prepare SDK
      run: |
        SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL" -O sdk.tar.zst
        tar --zstd -xf sdk.tar.zst
        SDK=$(ls -d openwrt-sdk-* | head -n1)
        echo "SDK=$SDK" >> $GITHUB_ENV
        echo "SDK 路径: $SDK"

    - name: Stage package
      run: |
        mkdir -p "$SDK/package/luci-app-autoreboot"
        cp -r Makefile files "$SDK/package/luci-app-autoreboot/"
        echo "--- 已复制内容 ---"
        ls -la "$SDK/package/luci-app-autoreboot/"

    - name: Build
      run: |
        cd "$SDK"

        # 1) 修 feeds 死 commit
        sed -i 's|git.openwrt.org/project/luci.git\^[0-9a-f]*|git.openwrt.org/project/luci.git;openwrt-25.12|' feeds.conf.default
        ./scripts/feeds update luci
        ./scripts/feeds install luci-base luci-mod-admin-full luci-theme-bootstrap

        # 2) 最小配置 —— 关键：不开 MULTI_PROFILE，单包才能生成 compile 目标
        rm -f .config .config.old
        cat > .config <<'EOF'
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_generic=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-autoreboot=y
        CONFIG_USE_APK=y
        EOF

        # 3) 展开配置（不要用 menuconfig，CI 无终端）
        make defconfig

        # 4) 调试：确认包确实被选入
        echo "--- .config 关键项 ---"
        grep -E 'luci-app-autoreboot|luci-base|USE_APK' .config || true

        # 5) 编译（先扫一遍包目录，确认目标存在）
        echo "--- 包目录内容 ---"
        ls package/luci-app-autoreboot/ || true
        make package/luci-app-autoreboot/compile -j$(nproc) V=s

    - name: Collect apk
      run: |
        mkdir -p /tmp/out
        find "$SDK/bin/" -name 'luci-app-autoreboot*.apk' -exec cp {} /tmp/out/ \;
        echo "--- 产物 ---"
        ls -lh /tmp/out || echo "未找到 apk"

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-autoreboot-mt7987a-apk
        path: /tmp/out/*.apk
