name: Build OpenWrt APK v3 (luci-app-autoreboot)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - name: Install build tools
        run: |
          apk add --no-cache apk-tools tar bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare package tree
        run: |
          set -e
          PKG=luci-app-autoreboot
          VER=1.0-r1
          ARCH=noarch

          # 构建根：把 files/ 下的 etc/ usr/ 铺到根
          mkdir -p /tmp/pkg
          if [ -d files ]; then
            cp -r files/. /tmp/pkg/
          else
            echo "ERROR: files/ directory missing" >&2
            exit 1
          fi

          # 确保 init.d 脚本可执行
          [ -f /tmp/pkg/etc/init.d/autoreboot ] && chmod 755 /tmp/pkg/etc/init.d/autoreboot

          # 创建 APK v3 必需的 .PKGINFO（不是 control！）
          mkdir -p /tmp/pkginfo
          cat > /tmp/pkginfo/.PKGINFO <<EOF
          pkgname = ${PKG}
          pkgver = ${VER}
          pkgdesc = LuCI app for scheduled reboot
          arch = ${ARCH}
          section = luci
          maintainer = Wenjw28
          depend = luci-base
          depend = cron
          EOF

          # 列出将要打包的文件，供 mkpkg 使用
          (cd /tmp/pkg && find . -type f -o -type l | sed 's|^\./||' | sort) > /tmp/manifest

      - name: Build APK with apk mkpkg (v3 ADB format)
        run: |
          set -e
          PKG=luci-app-autoreboot
          VER=1.0-r1
          ARCH=noarch
          OUT=/tmp/out
          mkdir -p "$OUT"

          # apk mkpkg 语法（apk-tools >= 2.14，Alpine 3.20 自带）
          # --info 从 .PKGINFO 读，--files 指定文件树根
          apk mkpkg \
            --info /tmp/pkginfo/.PKGINFO \
            --files /tmp/pkg \
            --output "$OUT/${PKG}_${VER}_${ARCH}.apk"

          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-autoreboot-openwrt-apk
          path: /tmp/out/*.apk
