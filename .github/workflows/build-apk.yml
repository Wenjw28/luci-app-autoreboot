name: Build Real OpenWrt APK v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3.20  # 必须用 Alpine，自带合规 apk-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: apk add --no-cache tar bash

      - name: Prepare & Build APK v3 (ADB)
        run: |
          set -e
          PKG=luci-app-autoreboot
          VER=1.0-r1
          ARCH=noarch
          OUT=/tmp/out
          BUILD=/tmp/pkg
          mkdir -p "$OUT" "$BUILD"

          # 复制文件（假设仓库根目录有 files/）
          cp -r files/* "$BUILD/" 2>/dev/null || cp -r files/. "$BUILD/"

          # 写 .PKGINFO（apk v3 必须）
          cat > "$BUILD/.PKGINFO" <<EOF
          pkgname = $PKG
          pkgver = $VER
          arch = $ARCH
          desc = LuCI App for Auto Reboot
          section = luci
          maintainer = you
          EOF

          # 官方工具打真 ADB 格式
          apk mkpkg \
            --info "$BUILD/.PKGINFO" \
            --files "$BUILD" \
            --output "$OUT/${PKG}_${VER}_${ARCH}.apk"

          ls -lh "$OUT"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-autoreboot-real-apk
          path: /tmp/out/*.apk
